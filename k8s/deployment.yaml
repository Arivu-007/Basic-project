apiVersion: apps/v1
kind: Deployment
metadata:
  name: basic-project
  labels:
    app: basic-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: basic-project
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: basic-project
    spec:
      containers:
      - name: basic-project
        image: arivu007/basic-project:23
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
